<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกบริการ - บริษัท รุ่งเจริญ จำกัด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .hidden { display: none; }
        #toast {
            position: fixed; top: 20px; right: 20px; z-index: 50;
            transition: opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="p-6">
    <div id="toast" class="hidden px-4 py-3 rounded-lg shadow-lg text-white font-medium"></div>

    <div class="max-w-7xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        <!-- Header -->
        <div class="bg-orange-500 p-6 text-white flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold">บริษัท รุ่งเจริญ จำกัด</h1>
                <p class="text-sm opacity-90 mt-1">ระบบบันทึกบริการทำส้ม และลูกหนี้ทางการค้า (เชื่อมต่อ Google Sheets แล้ว)</p>
            </div>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- ซ้าย: อัปโหลดบิลและข้อมูลทั่วไป -->
            <div class="space-y-6">
                <!-- API Key Config (ช่องสีส้ม) -->
                <div class="bg-amber-50 p-4 rounded-lg border border-amber-200">
                    <label class="block text-sm font-semibold text-amber-900 mb-1">Gemini API Key</label>
                    <input type="text" id="gemini-api-key" 
                           value="AQ.Ab8RN6I1Wc_ku59Nj_f_qArADWdSvCIP53m0pATqRXgpriCj1g" 
                           placeholder="วาง API Key ที่นี่" 
                           class="w-full border border-amber-300 rounded-md p-2 text-sm bg-white focus:ring-orange-500 focus:border-orange-500">
                    <p class="text-xs text-amber-700 mt-1">ตั้งค่ารหัสสแกนบิล AI เรียบร้อยแล้ว</p>
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4">อัปโหลดรูปภาพบิล (AI Auto-Scan)</h2>
                    <input type="hidden" id="bill-image-base64">
                    <input type="hidden" id="bill-image-mime" value="image/jpeg">
                    
                    <div class="flex items-center space-x-4">
                        <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition duration-200 text-sm font-medium shadow-sm">
                            <span>แนบรูปภาพบิล</span>
                            <input type="file" id="bill-input" accept="image/*" class="hidden" onchange="handleBillUpload(event)">
                        </label>
                        <button id="remove-bill-btn" onclick="removeBillImage()" class="hidden text-red-500 hover:text-red-700 text-sm underline">
                            ลบรูปภาพ
                        </button>
                    </div>
                    <div class="mt-4">
                        <img id="bill-image-preview" class="hidden max-h-64 rounded-md border border-gray-300 shadow-sm" alt="Bill Preview">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">วันที่</label>
                        <input type="text" id="record-date" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อลูกค้า</label>
                        <input type="text" id="custom-customer-input" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อสวน</label>
                        <input type="text" id="garden" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ตะกร้าเข้า (ใบ)</label>
                        <input type="number" id="in-qty" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ตะกร้าออก (ใบ)</label>
                        <input type="number" id="qty" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">น้ำหนักรวม (กก.)</label>
                        <input type="number" id="weight" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ยอดเงินรวม (บาท)</label>
                        <input type="number" id="amount" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">หน้าตะกร้า</label>
                        <input type="text" id="basket-name" class="w-full border border-gray-300 rounded-md p-2 focus:ring-orange-500 focus:border-orange-500">
                    </div>
                </div>

                <!-- ปุ่มบันทึกข้อมูลลง Google Sheets -->
                <button onclick="saveToGoogleSheets()" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-md shadow-md transition duration-200">
                    💾 บันทึกข้อมูลลง Google Sheets
                </button>
            </div>

            <!-- ขวา: ตารางเบอร์ส้ม -->
            <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="text-lg font-semibold text-gray-700 mb-4">รายละเอียดเบอร์ส้ม</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-200">
                            <tr>
                                <th class="px-3 py-2 rounded-tl-md">เบอร์</th>
                                <th class="px-3 py-2">ตะกร้า</th>
                                <th class="px-3 py-2">เศษ (กก.)</th>
                                <th class="px-3 py-2">น้ำหนักรวม</th>
                                <th class="px-3 py-2 rounded-tr-md">ราคา/กก.</th>
                            </tr>
                        </thead>
                        <tbody id="grades-tbody">
                            <!-- สร้างโดย JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const gradeNames = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'ส้มปัด', 'ส้มร่วง', 'เน่า-เสีย'];
        
        window.onload = function() {
            const tbody = document.getElementById('grades-tbody');
            gradeNames.forEach((name, idx) => {
                const tr = document.createElement('tr');
                tr.className = "bg-white border-b hover:bg-gray-50";
                tr.innerHTML = `
                    <td class="px-3 py-2 font-medium text-gray-900">${name}</td>
                    <td class="px-3 py-2"><input type="number" id="g-qty-${idx}" class="w-full border-gray-300 rounded p-1 text-sm"></td>
                    <td class="px-3 py-2"><input type="number" id="g-rem-${idx}" class="w-full border-gray-300 rounded p-1 text-sm"></td>
                    <td class="px-3 py-2"><input type="number" id="g-weight-${idx}" class="w-full border-gray-300 rounded p-1 text-sm"></td>
                    <td class="px-3 py-2"><input type="number" id="g-price-${idx}" class="w-full border-gray-300 rounded p-1 text-sm"></td>
                `;
                tbody.appendChild(tr);
            });

            // ดึง Key ที่เคยบันทึกไว้ในเครื่องมาแสดงให้อัตโนมัติ
            const savedKey = localStorage.getItem('rungjaroen_gemini_key');
            if (savedKey) {
                document.getElementById('gemini-api-key').value = savedKey;
            }
        };

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `px-4 py-3 rounded-lg shadow-lg text-white font-medium ${type === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            toast.classList.remove('hidden');
            setTimeout(() => { toast.classList.add('hidden'); }, 5000);
        }

        function handleBillUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('bill-image-mime').value = file.type || 'image/jpeg';

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result;
                document.getElementById('bill-image-base64').value = base64Data;
                
                const previewImg = document.getElementById('bill-image-preview');
                previewImg.src = base64Data;
                previewImg.classList.remove('hidden');
                document.getElementById('remove-bill-btn').classList.remove('hidden');
                
                showToast('กำลังวิเคราะห์บิลและดึงข้อมูลอัตโนมัติ...', 'success');
                setTimeout(() => { 
                    scanBillWithAI(); 
                }, 500);
            };
            reader.readAsDataURL(file);
        }

        async function scanBillWithAI() {
            const base64Img = document.getElementById('bill-image-base64').value;
            const mimeType = document.getElementById('bill-image-mime').value || 'image/jpeg';
            if (!base64Img) return;

            let apiKey = document.getElementById('gemini-api-key').value.trim();
            if (!apiKey) {
                showToast('กรุณากรอก Gemini API Key ในช่องด้านบนก่อนสแกนครับ', 'error');
                return;
            }

            // บันทึก Key ไว้ใช้ครั้งถัดไป
            localStorage.setItem('rungjaroen_gemini_key', apiKey);
            
            try {
                const base64Data = base64Img.split(',')[1];
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
                
                const promptText = `Analyze this Thai orange farm bill. Extract the data strictly into this JSON format:
                {
                  "date": "Date found on bill",
                  "customer": "Customer Name (DO NOT use 'บริษัท รุ่งเจริญ' or 'น้องบอมม์' or 'สำนักงานใหญ่')",
                  "service": "Service (e.g. ทำส้ม, ขายส้ม, ซื้อส้ม)",
                  "fruitType": "Fruit Type (e.g. สายน้ำผึ้ง)",
                  "garden": "Garden name (ชื่อสวน)",
                  "inQty": "Total in-baskets (number)",
                  "qty": "Total out-baskets (number)",
                  "weight": "Total weight (number)",
                  "amount": "Total amount in THB (number)",
                  "basketName": "Name on basket (ชื่อตะกร้า/หน้าตะกร้า)",
                  "grades": [
                    { "name": "Grade like 1,2,3,4,5,6,7,8,9,ส้มดี,ส้มปัด,เน่า-เสีย", "qty": "Basket count (number)", "rem": "Remainder kg (number)", "weight": "Total weight (number)", "price": "Price per kg (number)", "rowTotal": "Total price (number)" }
                  ]
                }
                Return ONLY valid JSON text without markdown code blocks.`;

                const payload = {
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: mimeType, data: base64Data } }
                        ]
                    }]
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API Key ไม่ถูกต้อง');
                }
                
                let jsonStr = data.candidates[0].content.parts[0].text;
                jsonStr = jsonStr.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const parsed = JSON.parse(jsonStr);
                applyScannedBillDataToForm(parsed);
                showToast('ดึงข้อมูลลงฟอร์มเรียบร้อยแล้ว!', 'success');
                
            } catch (err) {
                console.error("AI Scan Error:", err);
                showToast('การสแกนล้มเหลว: ' + err.message, 'error');
            }
        }

        function removeBillImage() {
            if(document.getElementById('bill-input')) document.getElementById('bill-input').value = '';
            if(document.getElementById('bill-image-base64')) document.getElementById('bill-image-base64').value = '';
            if(document.getElementById('bill-image-preview')) {
                document.getElementById('bill-image-preview').src = '';
                document.getElementById('bill-image-preview').classList.add('hidden');
            }
            if(document.getElementById('remove-bill-btn')) document.getElementById('remove-bill-btn').classList.add('hidden');
        }

        function applyScannedBillDataToForm(data) {
            if (!data) return;
            
            if (data.date) document.getElementById('record-date').value = data.date;
            if (data.garden) document.getElementById('garden').value = data.garden;
            if (data.inQty) document.getElementById('in-qty').value = data.inQty;
            if (data.qty) document.getElementById('qty').value = data.qty;
            if (data.weight) document.getElementById('weight').value = data.weight;
            if (data.amount) document.getElementById('amount').value = data.amount;
            if (data.basketName) document.getElementById('basket-name').value = data.basketName;
            if (data.customer) document.getElementById('custom-customer-input').value = data.customer;

            if (data.grades && data.grades.length > 0) {
                data.grades.forEach((g) => {
                    const matchedIdx = gradeNames.findIndex(name => g.name && g.name.toString().includes(name));
                    if (matchedIdx !== -1) {
                        if (document.getElementById(`g-qty-${matchedIdx}`)) document.getElementById(`g-qty-${matchedIdx}`).value = g.qty || '';
                        if (document.getElementById(`g-rem-${matchedIdx}`)) document.getElementById(`g-rem-${matchedIdx}`).value = g.rem || '';
                        if (document.getElementById(`g-weight-${matchedIdx}`)) document.getElementById(`g-weight-${matchedIdx}`).value = g.weight || '';
                        if (document.getElementById(`g-price-${matchedIdx}`)) document.getElementById(`g-price-${matchedIdx}`).value = g.price || '';
                    }
                });
            }
        }

        async function saveToGoogleSheets() {
            const scriptURL = 'https://script.google.com/macros/s/AKfycbx-iAibSsvdk0hI4BJDro14gvEYBu0V3jSmvFaaGewGgPiH8G97DIlRIUA0OaOJmLcPQQ/exec';

            const formData = {
                date: document.getElementById('record-date') ? document.getElementById('record-date').value : '',
                customer: document.getElementById('custom-customer-input') ? document.getElementById('custom-customer-input').value : '',
                service: 'ทำส้ม',
                fruitType: 'สายน้ำผึ้ง',
                garden: document.getElementById('garden') ? document.getElementById('garden').value : '',
                inQty: document.getElementById('in-qty') ? document.getElementById('in-qty').value : 0,
                qty: document.getElementById('qty') ? document.getElementById('qty').value : 0,
                weight: document.getElementById('weight') ? document.getElementById('weight').value : 0,
                amount: document.getElementById('amount') ? document.getElementById('amount').value : 0,
                basketName: document.getElementById('basket-name') ? document.getElementById('basket-name').value : ''
            };

            try {
                showToast('กำลังบันทึกข้อมูลลง Google Sheets...', 'success');
                
                await fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                showToast('บันทึกข้อมูลลง Google Sheets สำเร็จ!', 'success');
            } catch (error) {
                console.error('Error!', error.message);
                showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'error');
            }
        }
    </script>
</body>
</html>
